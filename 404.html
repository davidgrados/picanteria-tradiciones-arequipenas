<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, follow" />
<title>Página no encontrada | Tradiciones Arequipeñas</title>
<link rel="icon" type="image/png" href="/logo.png" />
<style>
  :root { --vino:#821615; --oro:#DC9949; --sillar:#F8F3E8; --ink:#210F08; --muted:#7C6D63; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--sillar); color:var(--ink); text-align:center; padding:2rem 1.25rem;
    font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .box { max-width:520px; }
  img { width:96px; height:auto; margin-bottom:1.25rem; }
  .code { font-size:4.5rem; font-weight:700; color:var(--vino); line-height:1; margin:0; }
  h1 { font-size:1.5rem; margin:.75rem 0 .5rem; }
  p { color:var(--muted); line-height:1.6; margin:0 0 1.75rem; }
  .btns { display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
  a.btn {
    display:inline-block; padding:.85rem 1.5rem; border-radius:999px; text-decoration:none;
    font-weight:600; font-size:.95rem; transition:transform .2s, background .2s;
  }
  a.primary { background:var(--vino); color:#fff; }
  a.primary:hover { transform:translateY(-2px); }
  a.ghost { border:1.5px solid var(--vino); color:var(--vino); }
  a.ghost:hover { background:rgba(130,22,21,.06); }
</style>
</head>
<body>
  <div class="box">
    <img src="/logo.png" alt="Tradiciones Arequipeñas" width="96" height="60" />
    <p class="code">404</p>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace haya cambiado o ya no exista. Pero no te preocupes: nuestra carta y todo lo demás te esperan.</p>
    <div class="btns">
      <a class="btn primary" href="/">Ir al inicio</a>
      <a class="btn ghost" href="/#carta">Ver la carta</a>
      <a class="btn ghost" href="https://wa.me/51923750726">Escribir por WhatsApp</a>
    </div>
  </div>
</body>
</html>
